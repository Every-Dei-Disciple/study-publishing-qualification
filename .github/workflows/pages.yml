name: Build and deploy Study articles

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publication source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render validated article site
        env:
          STUDY_SITE_BASE: /${{ github.event.repository.name }}
          STUDY_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 render.py --source content/posts --output _site --base "$STUDY_SITE_BASE" --commit "$STUDY_SOURCE_COMMIT"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
